version: "3.9"

services:
  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile

    ports:
      - "5173:5173"

    env_file:
      - ./client/.env

    depends_on:
      - backend

  backend:
    build:
      context: ./server
      dockerfile: Dockerfile

    expose:
      - "5000"

    env_file:
      - ./server/.env

  worker:
    build:
      context: ./server

    command: npm run worker

    env_file:
      - ./server/.env

  nginx:
    image: nginx:alpine

    ports:
      - "5000:80"

    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro

    depends_on:
      - backend